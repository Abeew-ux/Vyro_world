<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vallée 3D</title>
<style>
:root{--ink:#fff7ec;--panel:rgba(40,28,36,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--ink:#fff7ec;--panel:rgba(20,14,24,.6)}}
:root[data-theme="dark"]{--ink:#fff7ec;--panel:rgba(20,14,24,.6)}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2030;font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:0;right:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px}
#top{top:env(safe-area-inset-top,0px);padding-top:12px;align-items:flex-start}
#bot{bottom:env(safe-area-inset-bottom,0px);padding-bottom:14px}
.card{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.4;max-width:min(320px,60vw)}
.card b{font-size:17px;font-weight:normal;display:block;font-style:italic}
button{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid rgba(255,247,236,.35);border-radius:999px;padding:14px 22px;margin-left:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
button:active,button.on{background:rgba(243,185,138,.55)}
button:focus-visible{outline:2px solid #f3b98a;outline-offset:2px}
#dark{position:fixed;inset:0;background:#05040a;opacity:0;transition:opacity 1.8s;pointer-events:none}
#acts{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 164px);display:flex;justify-content:center;gap:8px;pointer-events:none}
#acts button{margin-left:0}
#joy{position:fixed;left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:132px;height:132px;border-radius:50%;background:var(--panel);border:1px solid rgba(255,247,236,.35);touch-action:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,247,236,.6);pointer-events:none}
.big{width:88px;height:88px;border-radius:50%;padding:0;margin:0 6px 4px 0}
#flash{position:fixed;inset:0;background:#dfe8ff;opacity:0;pointer-events:none}
#bubble{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 224px);max-width:min(320px,86vw);text-align:center;pointer-events:none}
#wxB{padding:10px 14px;font-size:14px}
#viewB{padding:10px 14px;font-size:14px}
#tb{display:flex;gap:8px;pointer-events:none}
@media (max-aspect-ratio:1/1){#tb{flex-direction:column;align-items:flex-end;gap:6px}}
@media (max-height:520px){#joy{width:112px;height:112px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}#knob{width:48px;height:48px;margin:-24px 0 0 -24px}.big{width:76px;height:76px;margin-bottom:0}#acts{bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}#bubble{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}.card{font-size:13px;padding:8px 12px}#wxB,#viewB{padding:8px 12px;font-size:13px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dark"></div>
<div id="flash"></div>
<div id="bubble" class="card" style="display:none"></div>
<div id="joy" aria-label="Joystick"><div id="knob"></div></div>
<div id="acts"><button id="sleepB" style="display:none">Dormir</button><button id="closetB" style="display:none">Ouvrir le placard</button></div>
<div id="hud" id="top"><div class="card"><b>La vallée du soir</b>Glisse pour regarder autour de toi. Maintiens « Avancer » pour marcher.</div></div>
<div id="hud" style="top:auto;bottom:env(safe-area-inset-bottom,0px);padding-bottom:14px;justify-content:flex-end">
  
  <button id="jumpB" class="big" aria-label="Sauter">Sauter</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const FOG=0xe8b995;
scene.fog=new THREE.Fog(FOG,60,420);
const camera=new THREE.PerspectiveCamera(65,1,0.1,1200);

// Bruit
function hash(x,y){let h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h)}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
 const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
 return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<5;i++){s+=a*vnoise(x*f,y*f);f*=2;a*=.5}return s}
function sstep(a,b,x){const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)}
function height(x,z){
 const n=fbm(x*.006+10,z*.006+10);
 const r=Math.hypot(x,z);
 let h=(n-.42)*95;
 h+=sstep(110,300,r)*90*fbm(x*.01,z*.01+7);
 h-=sstep(60,0,r)*0; 
 return 5;
}

// Terrain
const SIZE=640,SEG=220;
const g=new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);g.rotateX(-Math.PI/2);
const pos=g.attributes.position,col=new Float32Array(pos.count*3);
const cSand=new THREE.Color('#d9b886'),cGrass=new THREE.Color('#6f8a3c'),cGrass2=new THREE.Color('#4f6b2f'),
 cRock=new THREE.Color('#7d6f6a'),cSnow=new THREE.Color('#fff1e3'),tmp=new THREE.Color();
for(let i=0;i<pos.count;i++){
 const x=pos.getX(i),z=pos.getZ(i),h=height(x,z);pos.setY(i,h);
 const j=hash(x*.3,z*.3)*.12;
 if(h<1.6)tmp.copy(cSand);
 else if(h<22)tmp.copy(cGrass).lerp(cGrass2,sstep(2,22,h));
 else if(h<55)tmp.copy(cGrass2).lerp(cRock,sstep(22,38,h));
 else tmp.copy(cRock).lerp(cSnow,sstep(52,70,h));
 tmp.offsetHSL(0,0,j-.06);
 col[i*3]=tmp.r;col[i*3+1]=tmp.g;col[i*3+2]=tmp.b;
}
g.setAttribute('color',new THREE.BufferAttribute(col,3));
g.computeVertexNormals();
const terrain=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true}));scene.add(terrain);

// Eau
const water=new THREE.Mesh(new THREE.PlaneGeometry(SIZE*1.6,SIZE*1.6).rotateX(-Math.PI/2),
 new THREE.MeshPhongMaterial({color:0x3f7f9c,transparent:true,opacity:.78,shininess:90,specular:0xffd2a0,flatShading:true}));
water.position.y=0;scene.add(water);

// Lumières
const hemi=new THREE.HemisphereLight(0xffd9b0,0x4a5a3a,.75);scene.add(hemi);
const sunDir=new THREE.Vector3(-.6,.28,-.75).normalize();
const sun=new THREE.DirectionalLight(0xffc48a,1.1);sun.position.copy(sunDir).multiplyScalar(100);scene.add(sun);

// Ciel
const sky=new THREE.Mesh(new THREE.SphereGeometry(900,32,16),new THREE.ShaderMaterial({
 side:THREE.BackSide,depthWrite:false,fog:false,
 uniforms:{sd:{value:sunDir},cH:{value:new THREE.Color(.91,.73,.58)},cM:{value:new THREE.Color(.55,.5,.66)},cT:{value:new THREE.Color(.17,.27,.5)},st:{value:0}},
 vertexShader:'varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 p;uniform vec3 sd,cH,cM,cT;uniform float st;void main(){float t=clamp(p.y*1.6,0.,1.);vec3 hor=cH;vec3 mid=cM;vec3 top=cT;vec3 c=mix(hor,mid,smoothstep(0.,.35,t));c=mix(c,top,smoothstep(.3,1.,t));float s=max(dot(p,sd),0.);float up=smoothstep(-.02,.15,sd.y);c+=(vec3(1.,.7,.4)*pow(s,6.)*.6+vec3(1.,.95,.8)*pow(s,400.))*up;vec3 q=floor(p*260.);float h=fract(sin(dot(q,vec3(12.9,78.2,37.7)))*43758.5);c+=vec3(step(.9975,h))*st*smoothstep(.05,.4,p.y);gl_FragColor=vec4(c,1.);}'
}));
scene.add(sky);

// Cycle jour/nuit
let tod=.47;
const P={hor:[[.07,.09,.18],[.91,.73,.58],[.72,.84,.95]],mid:[[.04,.06,.14],[.55,.5,.66],[.45,.68,.9]],top:[[.01,.02,.07],[.17,.27,.5],[.2,.45,.8]]};
const moon=new THREE.Mesh(new THREE.SphereGeometry(28,16,12),new THREE.MeshBasicMaterial({color:0xe8ecff,fog:false}));scene.add(moon);
const _c=new THREE.Color();
function tri(a,e){const s1=sstep(-.12,.12,e),s2=sstep(.2,.55,e);return [0,1,2].map(i=>{const v=a[0][i]+(a[1][i]-a[0][i])*s1;return v+(a[2][i]-v)*s2})}
function applyTime(){
 const a=tod*Math.PI*2;sunDir.set(Math.cos(a)*.8,Math.sin(a),-.6).normalize();
 const E=sunDir.y,s1=sstep(-.12,.12,E),s2=sstep(.2,.55,E),u=sky.material.uniforms;
 u.cH.value.setRGB(...tri(P.hor,E));u.cM.value.setRGB(...tri(P.mid,E));u.cT.value.setRGB(...tri(P.top,E));
 u.st.value=1-sstep(-.2,.05,E);
 scene.fog.color.setRGB(...tri(P.hor,E));
 sun.position.copy(sunDir).multiplyScalar(E>=-.02?100:-100);
 sun.intensity=.25+.9*sstep(-.02,.2,E);
 sun.color.set(0x6f86c9).lerp(_c.set(0xffc48a),s1).lerp(_c.set(0xfff2dc),s2);
 hemi.color.set(0x2a3560).lerp(_c.set(0xffd9b0),s1).lerp(_c.set(0xcfe6ff),s2);
 hemi.groundColor.set(0x151a14).lerp(_c.set(0x4a5a3a),s1);
 hemi.intensity=.35+.4*s1+.1*s2;
 cm.color.set(0x262a40).lerp(_c.set(0xffe6d0),s1).lerp(_c.set(0xffffff),s2);
 const g=1-sstep(0,.35,E);
 winMat.color.set(0x8fa9b5).lerp(_c.set(0xffd98a),g);
 lampMat.color.set(0x8a8a80).lerp(_c.set(0xffe2a0),g);
 const w=wxAmt;
 if(w>.001){const gl=.25+.55*s1;_c.setRGB(.5*gl,.53*gl,.56*gl);
  scene.fog.color.lerp(_c,.8*w);u.cH.value.lerp(_c,.8*w);u.cM.value.lerp(_c,.8*w);u.cT.value.lerp(_c,.8*w);
  u.st.value*=1-w;sun.intensity*=1-.65*w;hemi.intensity*=1-.3*w;cm.color.multiplyScalar(1-.45*w)}
 scene.fog.far=420-260*w;scene.fog.near=60-40*w;
 const em=snowAmt*(.1+.4*s1);terrain.material.emissive.setRGB(em,em*1.03,em*1.08);leaves.material.emissive.setRGB(em*.8,em*.85,em*.9);
 if(flash>.01){hemi.intensity+=flash*1.6;scene.fog.color.lerp(_c.setRGB(.9,.92,1),flash*.7);flashEl.style.opacity=flash*.45}else flashEl.style.opacity=0;
 moon.position.copy(camera.position).addScaledVector(sunDir,-700);moon.visible=E<.1;
}

// Maison
let hx=0,hz=0,best=1e9;
for(let i=0;i<800;i++){const x=(Math.random()-.5)*260,z=(Math.random()-.5)*260,h=height(x,z);
 if(h<4||h>12)continue;
 let s=0;for(const [dx,dz] of [[6,5],[-6,5],[6,-5],[-6,-5]])s=Math.max(s,Math.abs(height(x+dx,z+dz)-h));
 if(s<best){best=s;hx=x;hz=z}}
const house=new THREE.Group();
function part(geo,color,x,y,z,basic){const me=new THREE.Mesh(geo,basic?new THREE.MeshBasicMaterial({color,fog:false}):new THREE.MeshLambertMaterial({color,flatShading:true}));me.position.set(x,y,z);house.add(me);return me}
let baseY=-1e9;for(const [dx,dz] of [[4.5,3.5],[-4.5,3.5],[4.5,-3.5],[-4.5,-3.5],[0,0]])baseY=Math.max(baseY,height(hx+dx,hz+dz));
const HR=Math.PI/4,WC=0xd2ad82;
part(new THREE.BoxGeometry(9,3,7),0x8a7d74,0,-1.5,0);
part(new THREE.BoxGeometry(7.7,.1,5.7),0x9b7a55,0,.05,0);
part(new THREE.BoxGeometry(8,4,.3),WC,0,2,-2.85);
part(new THREE.BoxGeometry(.3,4,6),WC,-3.85,2,0);
part(new THREE.BoxGeometry(.3,4,6),WC,3.85,2,0);
part(new THREE.BoxGeometry(3.2,4,.3),WC,-2.4,2,2.85);
part(new THREE.BoxGeometry(3.2,4,.3),WC,2.4,2,2.85);
part(new THREE.BoxGeometry(1.6,1.4,.3),WC,0,3.3,2.85);
part(new THREE.BoxGeometry(8,.2,6),0x6b4a33,0,4.1,0);
part(new THREE.BoxGeometry(2,.5,3.2),0x7a3b3b,2.5,.35,-1.1);
part(new THREE.BoxGeometry(1.5,.2,.6),0xf0e4d0,2.5,.7,-2.3);
part(new THREE.BoxGeometry(2,2.6,.5),0x5a3d2b,-2.6,1.4,-2.45);
part(new THREE.BoxGeometry(1.6,.8,1),0x7a5a3a,-1.6,.5,.2);
part(new THREE.BoxGeometry(3,.04,2),0x9a4a3a,.2,.12,1);
part(new THREE.SphereGeometry(.25,8,6),0xffe2a0,0,3.6,0,true);
const inLight=new THREE.PointLight(0xffc880,1.3,14);inLight.position.set(0,3.2,0);house.add(inLight);
const BOXES=[[-4,4,-3,-2.7],[-4,-3.7,-3,3],[3.7,4,-3,3],[-4,-.8,2.7,3],[.8,4,2.7,3],[1.5,3.5,-2.7,.5],[-3.6,-1.6,-2.7,-2.2],[-2.4,-.8,-.3,.7]];
const doorP=new THREE.Group();doorP.position.set(-.8,0,2.85);house.add(doorP);
const dm=new THREE.Mesh(new THREE.BoxGeometry(1.6,2.5,.12),new THREE.MeshLambertMaterial({color:0x4a2e1e}));dm.position.set(.8,1.25,0);doorP.add(dm);
BOXES.push([-.9,1.1,-2.7,-1.9]);
const WD=0x6b4a33;
part(new THREE.BoxGeometry(2,3,.06),WD,.1,1.6,-2.67);
part(new THREE.BoxGeometry(.06,3,.8),WD,-.87,1.6,-2.3);
part(new THREE.BoxGeometry(.06,3,.8),WD,1.07,1.6,-2.3);
part(new THREE.BoxGeometry(2,.06,.8),WD,.1,3.1,-2.3);
part(new THREE.BoxGeometry(2,.06,.8),WD,.1,.13,-2.3);
part(new THREE.CylinderGeometry(.03,.03,1.9,6).rotateZ(Math.PI/2),0xb8b0a8,.1,2.75,-2.3);
[[-.5,0xb5493c],[.1,0x3c5f8a],[.7,0xe8dcc4]].forEach(([x,c])=>part(new THREE.BoxGeometry(.5,1.5,.1),c,x,1.95,-2.3));
part(new THREE.BoxGeometry(.5,.2,.35),0x3a2a22,-.4,.26,-2.1);
part(new THREE.BoxGeometry(.5,.2,.35),0x2b2f3a,.3,.26,-2.1);
part(new THREE.BoxGeometry(1.8,.05,.7),WD,.1,.9,-2.3);
[[-.55,0xd9c9a3],[-.1,0x6b8f71],[.35,0xb5493c],[.8,0x3c5f8a]].forEach(([x,c])=>{part(new THREE.BoxGeometry(.38,.3,.34),c,x,1.075,-2.12);part(new THREE.BoxGeometry(.38,.2,.34),0xe8dcc4,x,1.325,-2.12)});
[[-.2,0x7a6aa8],[.4,0xd4a24a],[.95,0x4a7a6a]].forEach(([x,c])=>part(new THREE.BoxGeometry(.4,1.4,.1),c,x,2,-2.45));
const wdL=new THREE.Group(),wdR=new THREE.Group();
wdL.position.set(-.9,0,-1.88);wdR.position.set(1.1,0,-1.88);house.add(wdL,wdR);
const dmat=new THREE.MeshLambertMaterial({color:0x8a6240,flatShading:true});
const dl=new THREE.Mesh(new THREE.BoxGeometry(1,2.95,.05),dmat);dl.position.set(.5,1.58,0);wdL.add(dl);
const dr=new THREE.Mesh(new THREE.BoxGeometry(1,2.95,.05),dmat);dr.position.set(-.5,1.58,0);wdR.add(dr);
let sleeping=false,closetOpen=false;
const sleepB=document.getElementById('sleepB'),closetB=document.getElementById('closetB'),dark=document.getElementById('dark');
function setSleep(v){sleeping=v;dark.style.opacity=v?.92:0;sleepB.textContent=v?'Se lever':'Dormir';
 if(!v){const cx=.9,cz=.9;px=hx+cx*Math.cos(HR)+cz*Math.sin(HR);pz=hz-cx*Math.sin(HR)+cz*Math.cos(HR);pitch=0}}
sleepB.addEventListener('click',()=>setSleep(!sleeping));
closeB_init();
function closeB_init(){closetB.addEventListener('click',()=>{closetOpen=!closetOpen;closetB.textContent=closetOpen?'Fermer le placard':'Ouvrir le placard'})}
const roof=part(new THREE.ConeGeometry(6.3,3.4,4).rotateY(Math.PI/4),0x8a3b2e,0,5.7,0);roof.scale.z=.77;
roof.material.side=THREE.DoubleSide;
part(new THREE.BoxGeometry(1.2,1.2,.2),0xffd98a,-2.4,2.4,3.05,true);
part(new THREE.BoxGeometry(1.2,1.2,.2),0xffd98a,2.4,2.4,3.05,true);
part(new THREE.BoxGeometry(.8,2.6,.8),0x6b5a52,2.4,6.3,-1);
part(new THREE.BoxGeometry(3,.25,1.6),0x8a7d74,0,.1,3.9);
const lamp=new THREE.PointLight(0xffb060,1.2,28);lamp.position.set(0,3,5);house.add(lamp);
house.position.set(hx,baseY+.4,hz);house.rotation.y=Math.PI/4;scene.add(house);

// Village
const vA=HR+1.2,vx=hx+Math.sin(vA)*85,vz=hz+Math.cos(vA)*85,vy=height(vx,vz),aG=vA+Math.PI;
const winMat=new THREE.MeshBasicMaterial({color:0x8fa9b5}),lampMat=new THREE.MeshBasicMaterial({color:0x8a8a80});
const lam=c=>new THREE.MeshLambertMaterial({color:c,flatShading:true}),stone=lam(0x8d8680);
const village=new THREE.Group();scene.add(village);const VH=[];
function vp(par,geo,mat,x,y,z){const me=new THREE.Mesh(geo,mat);me.position.set(x,y,z);par.add(me);return me}
function mkHouse(x,z,ry,w,d,wc,rc){
 const g=new THREE.Group();
 vp(g,new THREE.BoxGeometry(w+.6,.8,d+.6),stone,0,.2,0);
 vp(g,new THREE.BoxGeometry(w,3.4,d),lam(wc),0,2.3,0);
 const r=vp(g,new THREE.ConeGeometry((w+1.2)/Math.SQRT2,3,4).rotateY(Math.PI/4),lam(rc),0,5.5,0);r.scale.z=(d+1.2)/(w+1.2);
 vp(g,new THREE.BoxGeometry(1.3,2.2,.2),lam(0x4a2e1e),0,1.5,d/2+.02);
 vp(g,new THREE.BoxGeometry(1,1,.2),winMat,-w/2+1.4,2.7,d/2+.02);
 vp(g,new THREE.BoxGeometry(1,1,.2),winMat,w/2-1.4,2.7,d/2+.02);
 vp(g,new THREE.BoxGeometry(.2,1,1),winMat,w/2+.02,2.7,0);
 vp(g,new THREE.BoxGeometry(.7,2.2,.7),stone,w/2-1.2,6.2,-d/4);
 g.position.set(x,height(x,z),z);g.rotation.y=ry;village.add(g);
 VH.push({x,z,ry,w,d,roof:true,r:Math.hypot(w,d)/2+2});
}
const COL=[0xd8b98e,0xc9a27a,0xe2cfae,0xb9a58a,0xd9c3a0],ROOF=[0x8a3b2e,0x6d4a3a,0x7a4f3a,0x4f5d6b,0x8c5a2e];
vp(village,new THREE.CylinderGeometry(12,12,.06,28),lam(0xc2a878),vx,vy+.03,vz);
for(let i=1;i<8;i++){const a=aG+i*Math.PI/4+(Math.random()-.5)*.15,R=23+Math.random()*3;
 mkHouse(vx+Math.sin(a)*R,vz+Math.cos(a)*R,a+Math.PI,6+Math.random()*3,5+Math.random()*2,COL[i%5],ROOF[(i*2)%5]);
 vp(village,new THREE.BoxGeometry(2.4,.06,R-14.5),lam(0xb89a6a),vx+Math.sin(a)*(R+7.5)/2,vy+.05,vz+Math.cos(a)*(R+7.5)/2).rotation.y=a}
for(let i=1;i<6;i++){if(i===3)continue;const a=aG+i*Math.PI/3+(Math.random()-.5)*.2,R=46+Math.random()*4;
 mkHouse(vx+Math.sin(a)*R,vz+Math.cos(a)*R,a+Math.PI,6+Math.random()*3,5+Math.random()*2,COL[(i+2)%5],ROOF[(i*3)%5])}
{const a=aG+Math.PI,R=36,cx=vx+Math.sin(a)*R,cz=vz+Math.cos(a)*R;
 mkHouse(cx,cz,a+Math.PI,8,11,0xe6dccb,0x5a4a52);
 const tx=cx+Math.sin(a)*7.5,tz=cz+Math.cos(a)*7.5;
 vp(village,new THREE.BoxGeometry(3.4,11,3.4),stone,tx,vy+5.5,tz).rotation.y=a;

function updateFoes(dt){
 const safe=indoor||sleeping||Math.hypot(px-vx,pz-vz)<66||Math.hypot(px-hx,pz-hz)<14;
 for(const f of foes){
  if(f.dead){f.dt-=dt;f.g.scale.y=Math.max(.05,f.dt/.5)*1.25;if(f.dt<=0){scene.remove(f.g);f.gone=true}continue}
  const dx=px-f.x,dz=pz-f.z,d=Math.hypot(dx,dz);let mv=false;
  if(!safe&&d<24){
   if(d>1.5){const s=(d<12?5.2:4.2)*dt;f.x+=dx/d*s;f.z+=dz/d*s;mv=true}else if(f.cd<=0){hurtPlayer(10);f.cd=1.1}
   f.ry=Math.atan2(dx,dz)}
  else{f.wt-=dt;if(f.wt<=0){f.wt=2+Math.random()*3;f.wa=Math.random()*6.28;f.ws=Math.random()<.5?0:1.2}
   if(f.ws){f.x+=Math.sin(f.wa)*f.ws*dt;f.z+=Math.cos(f.wa)*f.ws*dt;f.ry=f.wa;mv=true}}
  f.cd-=dt;
  if(f.kx){f.x+=f.kx*dt;f.z+=f.kz*dt;f.kx*=.88;f.kz*=.88;if(Math.abs(f.kx)+Math.abs(f.kz)<.1)f.kx=f.kz=0}
  const vd=Math.hypot(f.x-vx,f.z-vz);if(vd<64){f.x=vx+(f.x-vx)/vd*64;f.z=vz+(f.z-vz)/vd*64}
  f.x=Math.max(-290,Math.min(290,f.x));f.z=Math.max(-290,Math.min(290,f.z));
  f.t+=mv?dt*10:0;const sw=mv?Math.sin(f.t)*.7:0;f.L[0].rotation.x=sw;f.L[1].rotation.x=-sw;
  f.g.position.set(f.x,height(f.x,f.z),f.z);f.g.rotation.y=f.ry;
  if(f.flash>0){f.flash-=dt;setEm(f,f.flash>0?.8:0)}}
 for(let i=foes.length-1;i>=0;i--)if(foes[i].gone)foes.splice(i,1)}
function updateCombat(dt){
 if(!foesInit){foesInit=true;for(let i=0;i<9;i++)spawnFoe()}
 atkCd-=dt;if(atkAnim>0)atkAnim-=dt;
 if(gear.sword)gear.sword.rotation.x=atkAnim>0?-Math.sin((1-atkAnim/.3)*Math.PI)*1.2:0;
 hurtCd-=dt;if(hurtCd<=0&&hp<maxhp())hp=Math.min(maxhp(),hp+(indoor?12:3)*dt);
 spawnT-=dt;if(spawnT<=0){spawnT=10;if(foes.filter(f=>!f.dead).length<9)spawnFoe()}
 updateFoes(dt);
 saveT+=dt;if(saveT>8){saveT=0;save()}}
