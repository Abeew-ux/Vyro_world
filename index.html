    o.aggro-=dt;o.cd-=dt;
    const dx=P.x-g.position.x,dz=P.z-g.position.z,d=Math.hypot(dx,dz)||1;g.visible=o.sh.visible=d<27;let mx=0,mz=0,sp=0;
    if(((d<chaseR&&!inHouse)||o.aggro>0)&&!fainting){if(d>.95){mx=dx/d;mz=dz/d;sp=o.spd}g.rotation.y=Math.atan2(dx,dz)}
    else{o.hw-=dt;if(o.hw<=0){o.hw=1.5+Math.random()*2.5;o.ha=Math.random()*6.28;o.idle=Math.random()<.4}
      if(!o.idle){mx=Math.sin(o.ha);mz=Math.cos(o.ha);sp=o.spd*.35;g.rotation.y=o.ha}}
    const vx=mx*sp+o.kx,vz=mz*sp+o.kz;o.kx*=Math.pow(.0005,dt);o.kz*=Math.pow(.0005,dt);
    step(o,g.position.x+vx*dt,g.position.z+vz*dt);
    g.position.y+=(o.top+.5-g.position.y)*Math.min(1,dt*14);
    o.sh.position.set(g.position.x,o.top+.53,g.position.z);o.sh.scale.setScalar(o.zb?1.1:1.4);
    if(o.zb){const w2=sp>0?Math.sin(tt*7+o.ph)*.7:0;legs(g,w2);g.rig.rotation.x=sp>0?.12:0;g.lim[0].rotation.x=g.lim[1].rotation.x=-1.4+Math.sin(tt*5+o.ph)*.15;g.head.rotation.z=Math.sin(tt*3+o.ph)*.08}else{const hp2=sp>0?Math.abs(Math.sin(tt*5+o.ph)):0;g.body.position.y=.5+hp2*.35;g.body.scale.set(1.15-.2*hp2,.8+.35*hp2+.03*Math.sin(tt*3+o.ph),1.15-.2*hp2)}
    if(d<(o.boss?2:1.25)&&Math.abs(P.y-g.position.y)<1.4&&o.cd<=0&&inv<=0&&!sleeping&&!fainting){o.cd=1.2;hurt(g.position.x,g.position.z,o.boss?2:1)}}
  for(let i=E.length-1;i>=0;i--)if(E[i].dead&&E[i].t>.35){const g=E[i].g;scene.remove(g);scene.remove(E[i].sh);g.traverse(m=>{if(m.geometry)m.geometry.dispose();if(m.material)m.material.dispose()});E.splice(i,1);qpanel()}
  if(E.length===0){wv-=dt;if(wv<=0){nextWave();wv=4}}else wv=4;
  // PNJ + miroir
  near=null;NP.forEach(o=>{const g=o.g;g.position.x=o.x+Math.sin(tt*.4+o.ph)*1.3;g.position.z=o.z+Math.cos(tt*.3+o.ph)*1.3;g.position.y=surf(g.position.x,g.position.z,14)+.5;
    const dx=P.x-g.position.x,dz=P.z-g.position.z,d=Math.hypot(dx,dz);
    if(d<3.2){near=o;g.rotation.y=Math.atan2(dx,dz)}else g.rotation.y=Math.atan2(Math.cos(tt*.4+o.ph),-Math.sin(tt*.3+o.ph));
    legs(g,Math.sin(tt*3+o.ph)*.4);g.lim[0].rotation.x=-g.lim[2].rotation.x*.8;g.lim[1].rotation.x=-g.lim[3].rotation.x*.8;g.el[0].rotation.x=g.el[1].rotation.x=-.2;g.head.position.y=2.3+Math.sin(tt*2+o.ph)*.015});
  if(inHouse&&Math.hypot(P.x-MI.mx,P.z-MI.mz)<2.4)near=MI;
  $("talk").style.display=near?"block":"none";$("sleep").style.display=(inHouse&&dayV<=.45&&!sleeping&&!fainting)?"block":"none";
  $("fire").style.opacity=en<2||fcd>0?.45:1;$("shd").style.opacity=en<3||shT>0?.45:1;$("spin").style.opacity=scd>0?.45:1;$("roll").style.opacity=rcd>0?.45:1;$("zk").style.opacity=zcd>0||en<2?.45:1;$("vk").style.opacity=vcd>0||en<3?.45:1;$("cri").style.opacity=ccd>0||en<4?.45:1;
  $("enb").style.width=(en/enM*100)+"%";$("ent").textContent="Energy "+Math.floor(en*13.5)+"/"+Math.round(enM*13.5);$("xpt").textContent=xp+"/"+xpNeed(lvl);$("xpb").style.width=(xp/xpNeed(lvl)*100)+"%";
  if((tt|0)!==lq){lq=tt|0;qpanel()}
  // ombre du héros
  const gy=surf(P.x,P.z,Math.floor(P.y+.6));if(false){hshadow.visible=true;hshadow.position.set(P.x,gy+.53,P.z);hshadow.scale.setScalar(Math.max(.4,1.5-clamp(P.y-(gy+.5),0,3)*.3))}else hshadow.visible=false;
  // caméra orbitale
  const cp=Math.cos(pitch),tp=new THREE.Vector3(P.x+Math.sin(yaw)*cp*dist,P.y+1.45+Math.sin(pitch)*dist,P.z+Math.cos(yaw)*cp*dist);
  {let kc=1;for(let i=1;i<=12;i++){const f=i/12,bx=Math.round(L(P.x,tp.x,f)),by=Math.round(L(P.y+1,tp.y,f)),bz=Math.round(L(P.z,tp.z,f)),bb=get(bx,by,bz);if(bb&&!(inHouse&&roof.has(key(bx,by,bz)))){kc=Math.max(.2,(i-1)/12);break}}tp.set(L(P.x,tp.x,kc),L(P.y+1,tp.y,kc),L(P.z,tp.z,kc))}
  cam.position.lerp(tp,Math.min(1,dt*10));
  const tf=70;if(Math.abs(cam.fov-tf)>.05){cam.fov=L(cam.fov,tf,Math.min(1,dt*8));cam.updateProjectionMatrix()}
  const gt=surf(cam.position.x,cam.position.z,14);if(gt>=0&&cam.position.y<gt+.8)cam.position.y=gt+.8;
  cam.lookAt(P.x,P.y+1.45,P.z);
  let sx=0,sy2=0;if(shk>0){sx=(Math.random()-.5)*shk;sy2=(Math.random()-.5)*shk;cam.position.x+=sx;cam.position.y+=sy2}
  ren.render(scene,cam);cam.position.x-=sx;cam.position.y-=sy2}
loop();setHp();setCoin();qpanel();$("lv").textContent="Lv. "+lvl;
addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
</script>
